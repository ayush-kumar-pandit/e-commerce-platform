{% extends 'base.html' %}
{% load static %}

{% block title %}Logout | Bharat Sanjeevani{% endblock %}

{% block content %}
<div class="flex items-center justify-center min-h-[calc(100vh-200px)] py-12 px-4">
    <div class="w-full max-w-md bg-white dark:bg-gray-800 shadow-xl rounded-lg p-10 text-center border border-gray-100 dark:border-gray-700">
        <h1 class="text-3xl font-bold text-green-800 dark:text-green-500 mb-4">
            Logout
        </h1>

        <p class="text-gray-600 dark:text-gray-300 mb-8">
            Are you sure you want to log out?
        </p>

        <form method="POST">
            {% csrf_token %}
            <div class="flex justify-center gap-4">
                <a href="{% url 'home' %}"
                   class="border border-green-800 dark:border-green-600 text-green-800 dark:text-green-500 px-6 py-2 rounded hover:bg-green-800 hover:text-white dark:hover:bg-green-600 dark:hover:text-white transition">
                    Cancel
                </a>

                <button type="submit"
                        class="bg-green-800 dark:bg-green-700 text-white px-6 py-2 rounded hover:bg-green-900 dark:hover:bg-green-600 transition">
                    Yes, Logout
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
